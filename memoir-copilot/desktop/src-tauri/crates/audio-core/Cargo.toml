[package]
name = "memoir-audio-core"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "memoir-audio-cli"
path = "src/bin/audio_cli.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
cpal = "0.15"
flacenc = "0.4"
sha2 = "0.10"
