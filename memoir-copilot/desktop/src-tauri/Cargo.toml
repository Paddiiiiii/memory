[package]
name = "memoir-copilot"
version = "0.1.0"
description = "Memoir Interview Copilot"
authors = ["Memoir"]
edition = "2021"

[lib]
name = "memoir_copilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
parking_lot = "0.12"
base64 = "0.22"
memoir-audio-core = { path = "crates/audio-core" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
