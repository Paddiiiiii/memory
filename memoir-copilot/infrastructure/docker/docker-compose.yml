services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: memoir
      POSTGRES_PASSWORD: memoir
      POSTGRES_DB: memoir
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memoir -d memoir"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api
    env_file:
      - ../../backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://memoir:memoir@postgres:5432/memoir
      DATABASE_URL_SYNC: postgresql+psycopg://memoir:memoir@postgres:5432/memoir
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      MEMOIR_SEEDS_DIR: /app/seeds
    ports:
      - "8000:8000"
    volumes:
      - mediadata:/app/.data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "uv run alembic upgrade head &&
             uv run python -m scripts.bootstrap_admin &&
             uv run python -m scripts.seed_prompts &&
             uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api
    env_file:
      - ../../backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://memoir:memoir@postgres:5432/memoir
      DATABASE_URL_SYNC: postgresql+psycopg://memoir:memoir@postgres:5432/memoir
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      MEMOIR_SEEDS_DIR: /app/seeds
    volumes:
      - mediadata:/app/.data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    command: uv run celery -A app.workers.celery_app.celery_app worker -l info

volumes:
  pgdata:
  mediadata:
