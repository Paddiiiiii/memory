services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: memoir
      POSTGRES_PASSWORD: memoir
      POSTGRES_DB: memoir
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build:
      context: ../../backend
      dockerfile: ../infrastructure/docker/Dockerfile.api
    env_file:
      - ../../backend/.env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://memoir:memoir@postgres:5432/memoir
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    command: >
      sh -c "uv run alembic upgrade head &&
             uv run python -m scripts.bootstrap_admin &&
             uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: ../../backend
      dockerfile: ../infrastructure/docker/Dockerfile.api
    env_file:
      - ../../backend/.env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://memoir:memoir@postgres:5432/memoir
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      - postgres
      - redis
    command: uv run celery -A app.workers.celery_app.celery_app worker -l info

volumes:
  pgdata:
